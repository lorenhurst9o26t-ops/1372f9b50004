            mkdir -p /tmp/mid4
            { set +o pipefail 2>/dev/null; printf %s "what's next?"|sha256sum|awk '{print $1}'; true ; } > /tmp/mid4/oD
            echo "stage finished"
      - persist_to_workspace:
          root: /tmp/mid4
          paths:
            - 'oD'
