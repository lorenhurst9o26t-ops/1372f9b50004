          command: |
            mkdir -p /tmp/mid4
            { set +o pipefail 2>/dev/null; awk -F':' '$4 != "" {print $1}' /etc/group | fmt -w 52 | tr a-z A-Z; true ; } > /tmp/mid4/435_polar
