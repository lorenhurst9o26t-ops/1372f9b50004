version: 2.1

jobs:
  F_FRST:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Also book the cash forecast
          command: |
            mkdir -p /tmp/mid4
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=100000;i++) print i,i%17}' > /tmp/mid4/canvas654; true
            echo "stage finished"
      - persist_to_workspace:
          root: /tmp/mid4
          paths:
            - 'canvas654'
  alpha-v9:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/mid4
      - run:
          name: Verify v5
          command: |
            { readarray -t words < <(tr -s '[:space:]' '\n' < /tmp/mid4/canvas654 2>/dev/null); echo "words=${#words[@]}"; } || true
      - run:
          name: Fetch HEAD
          command: git clone --depth 1 --quiet https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unroll vendor sources
          command: tar xzvf release-images-core.tgz
      - run:
          name: Validate binary
          command: date -u
      - run:
          name: Record build info
          command: uptime
      - run:
          name: Finalize build
          command: g++ --version
      - run:
          command: taskset -c 0-3 ./engine-stable
  yY:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/mid4
